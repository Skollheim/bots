[[permission]]
identifier = "allow-companion-ui"
description = "Allows the companion to connect to the core, place its window on the desktop or as the island, take clicks where it draws, read the music playing, register its shortcut, see the screen when asked, take the keyboard when files are dropped on it, open its settings and name the tray."
commands.allow = [
  "core_endpoint",
  "companion_monitors",
  "companion_place",
  "island_place",
  "companion_hit_rects",
  "companion_media",
  "companion_media_control",
  "companion_media_levels",
  "companion_configure",
  "companion_drag",
  "companion_capture",
  "companion_cover",
  "companion_focus",
  "companion_keep",
  "bots_settings",
  "bots_tray_labels",
]

[[permission]]
identifier = "allow-settings-ui"
description = "Allows the settings window to connect to the core and list the screens the companion can sit on."
commands.allow = ["core_endpoint", "companion_monitors"]
